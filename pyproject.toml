[project]
name = "tastelens"
version = "0.1.0"
description = "Restaurant recommendations from review text (NLP Gen AI group project)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yannick Kuete" }, { name = "Luc Dinh" }, { name = "Tej Kandimalla" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "frontend"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# scripts put the repository root on sys.path before importing the package
"scripts/*.py" = ["E402"]
